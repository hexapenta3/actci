name: Missing share data
run-name: Run by @${{ github.actor }}
on: push
jobs:
   share:
    runs-on: ubuntu-latest
    steps:
      - id: source
        run: echo "result=Hello" >> "${GITHUB_OUTPUT}"
      - env:
          RESULT: ${{ steps.source.outputs.result }}
        run: echo "${RESULT}"
      - run: echo "${{ toJSON(steps.source.outputs) }}"




