[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "actci"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.0.3",
]



[tool.setuptools.packages.find]
where = ["."]
include = ["actci*"]
exclude = ["tests", "tests.*"]


[tool.uv]
dev-dependencies = ["pytest"]


