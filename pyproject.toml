[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "actci"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []


[dependency-groups]
dev = ["pytest>=9.0.3"]

[project.optional-dependencies]
dev = ["pytest"]



[tool.setuptools.packages.find]
where = ["."]
include = ["actci*"]
exclude = ["tests", "tests.*"]




